<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acupuncture Quiz</title>
<style>
:root {
  --primary: #2563eb;
  --success: #16a34a;
  --danger: #dc2626;
  --bg: #f8fafc;
  --card: #ffffff;
}

* { box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: #1e293b;
  max-width: 900px;
  margin: 20px auto;
  padding: 16px;
  line-height: 1.6;
}

@media (max-width: 600px) {
  body { margin: 10px auto; padding: 12px; }
}

h1 {
  text-align: center;
  color: #0f172a;
  margin-bottom: 8px;
  font-size: 2rem;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  margin-bottom: 20px;
}

button {
  background: var(--primary);
  color: white;
  border: none;
  padding: 14px 24px;
  font-size: 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  margin: 8px;
  min-height: 52px;
  touch-action: manipulation;
}

button:hover { background: #1d4ed8; }
button.secondary { background: #64748b; }
button.warning { background: #f59e0b; color: white; }
button.danger { background: #dc2626; }

.option {
  padding: 16px 18px;
  border: 2px solid #e2e8f0;
  border-radius: 14px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 16px;
  min-height: 60px;
  display: flex;
  align-items: center;
  touch-action: manipulation;
}

@media (max-width: 600px) {
  .option {
    font-size: 16px;
    padding: 18px 20px;
    min-height: 64px;
  }
  
  button {
    font-size: 17px;
    padding: 16px 24px;
    min-height: 56px;
  }
}

.option:hover { border-color: #94a3b8; background: #f8fafc; }
.option.selected { border-color: var(--primary); background: #eff6ff; }
.option.correct { border-color: var(--success); background: #dcfce7; }
.option.incorrect { border-color: var(--danger); background: #fee2e2; }

#question {
  font-size: 1.15em;
  font-weight: 600;
  margin-bottom: 24px;
  line-height: 1.5;
}

#explanation {
  background: #fefce8;
  border-left: 5px solid #eab308;
  padding: 18px 20px;
  border-radius: 14px;
  margin-top: 24px;
  display: none;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin: 20px 0;
}

.stat-card {
  background: #f1f5f9;
  padding: 18px;
  border-radius: 14px;
  text-align: center;
}

.stat-number {
  font-size: 1.7em;
  font-weight: 700;
  color: var(--primary);
}

.domain-stats {
  margin-top: 24px;
}

.domain-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #f8fafc;
  border-radius: 12px;
  margin-bottom: 10px;
  font-size: 0.95em;
}

.domain-name {
  font-weight: 600;
  flex: 1;
}

.domain-progress {
  color: #64748b;
  font-size: 0.9em;
}

.domain-bar {
  height: 7px;
  background: #e2e8f0;
  border-radius: 9999px;
  margin-top: 8px;
  overflow: hidden;
}

.domain-bar-fill {
  height: 100%;
  background: var(--primary);
  transition: width 0.3s ease;
}

.domain-checkbox {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #f8fafc;
  border-radius: 12px;
  margin-bottom: 10px;
}

.domain-checkbox input {
  width: 20px;
  height: 20px;
}

.focus-button {
  background: #7c3aed;
  margin-top: 12px;
}

.focus-button:hover {
  background: #6d28d9;
}

.reset-domain-btn {
  background: #ef4444;
  color: white;
  border: none;
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 8px;
  cursor: pointer;
  margin-left: 12px;
}

.exam-button {
  background: #059669;
  font-size: 17px;
  padding: 16px 32px;
}

.exam-button:hover {
  background: #047857;
}

.note-textarea {
  width: 100%;
  min-height: 80px;
  padding: 12px;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  font-size: 15px;
  resize: vertical;
  margin-top: 8px;
}

.flag-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}

.flag-checkbox input {
  width: 18px;
  height: 18px;
}

.review-actions {
  margin-top: 16px;
  padding: 14px 16px;
  background: #f8fafc;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
}

.review-header {
  font-weight: 600;
  font-size: 0.9em;
  color: #475569;
  margin-bottom: 10px;
}

.flag-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 0.95em;
  color: #334155;
}

.flag-checkbox input {
  width: 18px;
  height: 18px;
  accent-color: #2563eb;
}

/* Phase C: Component Polish */
.card {
  padding: 26px;
  border-radius: 18px;
}

@media (max-width: 600px) {
  .card {
    padding: 20px;
    border-radius: 16px;
  }
}

button {
  font-weight: 600;
  letter-spacing: 0.2px;
}

button.secondary {
  background: #e2e8f0;
  color: #334155;
}

button.secondary:hover {
  background: #cbd5e1;
}

.domain-row {
  padding: 14px 16px;
  margin-bottom: 10px;
}

.domain-checkbox {
  padding: 12px 16px;
  margin-bottom: 10px;
}

.stats-grid {
  gap: 14px;
}

.stat-card {
  padding: 18px 16px;
  border-radius: 14px;
}

/* Better typography */
body {
  font-size: 15.5px;
  line-height: 1.65;
}

h3 {
  font-size: 1.05em;
  font-weight: 700;
  color: #0f172a;
}

/* Phase D: Mobile Refinements */
@media (max-width: 600px) {
  body {
    font-size: 15px;
    padding: 12px;
    margin: 12px auto;
  }

  .card {
    padding: 20px 18px;
  }

  button {
    font-size: 16px;
    padding: 15px 20px;
    min-height: 52px;
  }

  .option {
    font-size: 15.5px;
    padding: 16px 18px;
    min-height: 58px;
  }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .domain-row {
    padding: 12px 14px;
  }

  h3 {
    font-size: 1em;
  }

  .review-actions {
    padding: 12px 14px;
  }
}

/* Ensure good touch targets */
button, .option, input[type="checkbox"] {
  min-height: 48px;
}

.option {
  min-height: 56px;
}
</style>
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div id="home">
  <h1>Acupuncture Quiz</h1>
  <p style="text-align:center; color:#64748b; margin-bottom:16px;">1210 questions • Smart Mastery System</p>
  
  <div class="card">
    
    <!-- 1. Quick Stats -->
    <h3 style="margin-top:0; margin-bottom:16px; color:#0f172a;">Your Progress</h3>
    <div class="stats-grid" id="home-stats"></div>
    
    <!-- 2. Domain Performance -->
    <div class="domain-stats" id="domain-stats"></div>
    
    <!-- 3. Study Actions -->
    <div style="margin-top:28px;">
      <h3 style="margin-bottom:14px; color:#0f172a;">Quick Study</h3>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button onclick="startQuiz(10)" id="btn10" disabled style="flex:1; min-width:140px; background:#16a34a;">
          Start 10 Questions
        </button>
        <button onclick="startQuiz(20)" id="btn20" disabled style="flex:1; min-width:140px;">
          Start 20 Questions
        </button>
      </div>
      
      <h3 style="margin:20px 0 14px; color:#0f172a;">Focused Study</h3>
      <button onclick="focusOnWeakDomains()" class="focus-button" style="width:100%;">
        Focus on My Weak Domains
      </button>
      
      <h3 style="margin:20px 0 14px; color:#0f172a;">Exam Practice</h3>
      <button onclick="startExamSimulation()" class="exam-button" style="width:100%;">
        Take Practice Exam (100 Questions)
      </button>
    </div>
    
    <!-- 4. Domain Filter (Collapsible) -->
    <details style="margin-top:28px;">
      <summary style="font-weight:600; color:#475569; cursor:pointer; padding:8px 0; user-select:none;">
        Filter by Domain (Advanced)
      </summary>
      <div style="margin-top:12px;">
        <div id="domain-checkboxes"></div>
        
        <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
          <button onclick="selectAllDomains()" class="secondary" style="flex:1; font-size:14px; padding:10px 16px; min-height:44px;">
            Select All
          </button>
          <button onclick="selectWeakDomains()" class="secondary" style="flex:1; font-size:14px; padding:10px 16px; min-height:44px;">
            Select Weak Domains
          </button>
        </div>
      </div>
    </details>
    
    <div style="text-align:center; margin-top:24px;">
      <button onclick="resetAllProgress()" class="secondary">Reset All Progress</button>
    </div>
  </div>
</div>

<div id="quiz" style="display:none;">
  <div class="card">
    <div id="progress"></div>
    <div id="question"></div>
    <div id="options"></div>
    <div id="explanation"></div>
    
    <div style="margin-top:24px; display:flex; gap:12px; flex-wrap:wrap;" id="action-buttons">
      <button onclick="submitAnswer()" id="submitBtn">Submit Answer</button>
      <button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next Question</button>
      <button onclick="markAsMastered()" id="masterBtn" class="warning" style="display:none;">Mark as Mastered</button>
    </div>
  </div>
</div>

<div id="results" style="display:none;">
  <div class="card">
    <h2 style="margin-top:0;">Quiz Complete</h2>
    <div id="stats"></div>
    <div style="margin-top:24px;">
      <button onclick="startQuiz(currentQuizLength)">Take Another Quiz</button>
      <button onclick="goHome()" class="secondary">Back to Home</button>
    </div>
  </div>
</div>

<script>
// QUESTIONS loaded from JSON
let QUESTIONS = [];
let SELECTED_DOMAINS = [];

// NCCAOM Domain Weights
const DOMAIN_WEIGHTS = {
  "Domain I: Acupuncture Point Location (15%)": 0.15,
  "Domain II: Safety for Acupuncture Practice (15%)": 0.15,
  "Domain III: Treatment Plan (40%)": 0.40,
  "Domain IV: Treatment Techniques (30%)": 0.30
};

let progress = JSON.parse(localStorage.getItem('acu_mastery_progress') || '{}');

function saveProgress() {
  localStorage.setItem('acu_mastery_progress', JSON.stringify(progress));
}

let currentQuiz = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];
let currentQuizLength = 20;
let isExamMode = false;

// Load questions
async function loadQuestions() {
  try {
    const response = await fetch('questions_refined_4_domains.json');
    if (!response.ok) throw new Error('Failed to load questions');
    
    QUESTIONS = await response.json();
    
    document.getElementById('btn10').disabled = false;
    document.getElementById('btn20').disabled = false;
    
    renderDomainCheckboxes();
    updateHomeStats();
    
  } catch (error) {
    console.error(error);
    document.getElementById('home').innerHTML = `
      <div class="card">
        <h2 style="color:#dc2626;">Error Loading Questions</h2>
        <p>Could not load <strong>questions_refined_4_domains.json</strong>.</p>
      </div>
    `;
  }
}

// Render domain checkboxes
function renderDomainCheckboxes() {
  const container = document.getElementById('domain-checkboxes');
  container.innerHTML = '';
  
  const domains = [...new Set(QUESTIONS.map(q => q.domain))];
  
  domains.forEach(domain => {
    const div = document.createElement('div');
    div.className = 'domain-checkbox';
    
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = true;
    checkbox.dataset.domain = domain;
    
    const label = document.createElement('label');
    label.textContent = domain;
    
    div.appendChild(checkbox);
    div.appendChild(label);
    container.appendChild(div);
  });
}

// Get selected domains
function getSelectedDomains() {
  const checkboxes = document.querySelectorAll('#domain-checkboxes input[type="checkbox"]');
  const selected = [];
  checkboxes.forEach(cb => {
    if (cb.checked) selected.push(cb.dataset.domain);
  });
  return selected.length > 0 ? selected : null;
}

// Calculate mastery per domain
function getDomainMastery() {
  const domains = [...new Set(QUESTIONS.map(q => q.domain))];
  const mastery = {};
  
  domains.forEach(domain => {
    const domainQuestions = QUESTIONS.filter(q => q.domain === domain);
    let mastered = 0;
    
    domainQuestions.forEach(q => {
      const p = progress[q.id];
      if (p && p.mastered) mastered++;
    });
    
    const percent = domainQuestions.length > 0 
      ? Math.round((mastered / domainQuestions.length) * 100) 
      : 0;
    
    mastery[domain] = {
      mastered: mastered,
      total: domainQuestions.length,
      percent: percent
    };
  });
  
  return mastery;
}

// Focus on weakest domains
function focusOnWeakDomains() {
  if (!QUESTIONS || QUESTIONS.length === 0) return;
  
  const mastery = getDomainMastery();
  const sortedDomains = Object.entries(mastery)
    .sort((a, b) => a[1].percent - b[1].percent);
  
  const weakestCount = Math.max(2, Math.ceil(sortedDomains.length / 2));
  const weakestDomains = sortedDomains.slice(0, weakestCount).map(d => d[0]);
  
  const checkboxes = document.querySelectorAll('#domain-checkboxes input[type="checkbox"]');
  checkboxes.forEach(cb => {
    cb.checked = weakestDomains.includes(cb.dataset.domain);
  });
  
  alert(`Focused on your weakest domains:\n${weakestDomains.join('\n')}`);
}

// Update home stats
function updateHomeStats() {
  if (!QUESTIONS || QUESTIONS.length === 0) return;
  
  // Proper categorization
  let mastered = 0;
  let missed = 0;
  let learning = 0;      // In Progress / Learning
  let neverSeen = 0;
  let flagged = 0;

  for (let q of QUESTIONS) {
    const p = progress[q.id];
    
    if (!p) {
      neverSeen++;
      continue;
    }
    
    if (p.flagged) flagged++;
    
    if (p.mastered) {
      mastered++;
    } 
    else if (p.seen > 0 && p.ever_wrong && p.correct_streak < 2) {
      missed++;
    } 
    else if (p.seen > 0) {
      learning++;
    }
  }

  document.getElementById('home-stats').innerHTML = `
    <div class="stat-card">
      <div class="stat-number">${QUESTIONS.length}</div>
      <div style="color:#64748b; font-size:0.9em;">Total Questions</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" style="color:#16a34a;">${mastered}</div>
      <div style="color:#64748b; font-size:0.9em;">Mastered</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" style="color:#dc2626;">${missed}</div>
      <div style="color:#64748b; font-size:0.9em;">Missed (Active)</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" style="color:#f59e0b;">${learning}</div>
      <div style="color:#64748b; font-size:0.9em;">In Progress</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" style="color:#2563eb;">${neverSeen}</div>
      <div style="color:#64748b; font-size:0.9em;">Never Seen</div>
    </div>
  `;


    // Domain breakdown with reset buttons
  const domains = [...new Set(QUESTIONS.map(q => q.domain))];
  let html = '<h3 style="margin-top:24px; margin-bottom:12px;">Domain Performance</h3>';
  
  domains.forEach(domain => {
    const domainQuestions = QUESTIONS.filter(q => q.domain === domain);
    let dMastered = 0, dMissed = 0, dNever = 0;
    
    domainQuestions.forEach(q => {
      const p = progress[q.id];
      if (!p) { dNever++; return; }
      if (p.mastered) dMastered++;
      else if (p.seen > 0 && p.correct_streak < 2 && p.ever_wrong) dMissed++;
      else if (p.seen === 0) dNever++;
    });
    
    const percent = domainQuestions.length > 0 
      ? Math.round((dMastered / domainQuestions.length) * 100) 
      : 0;
    
    html += `
      <div class="domain-row">
        <div style="flex:1">
          <div class="domain-name">${domain}</div>
          <div class="domain-progress">${dMastered} / ${domainQuestions.length} mastered (${percent}%)</div>
          <div class="domain-bar">
            <div class="domain-bar-fill" style="width: ${percent}%"></div>
          </div>
        </div>
        <button onclick="resetDomainProgress('${domain}')" class="reset-domain-btn">Reset</button>
      </div>
    `;
  });
  
  document.getElementById('domain-stats').innerHTML = html;
}

// Reset progress for a specific domain
function resetDomainProgress(domain) {
  if (!confirm(`Reset all progress for:
${domain}?`)) return;
  
  const domainQuestions = QUESTIONS.filter(q => q.domain === domain);
  
  domainQuestions.forEach(q => {
    if (progress[q.id]) {
      delete progress[q.id];
    }
  });
  
  saveProgress();
  updateHomeStats();
  alert(`Progress for ${domain} has been reset.`);
}

function startQuiz(length) {
  if (!QUESTIONS || QUESTIONS.length === 0) {
    alert('Questions are still loading...');
    return;
  }
  
  const selected = getSelectedDomains();
  if (!selected) {
    alert('Please select at least one domain.');
    return;
  }
  
  isExamMode = false;
  SELECTED_DOMAINS = selected;
  currentQuizLength = length;
  
  currentQuiz = selectSmartQuestions(length);
  currentIndex = 0;
  score = 0;
  userAnswers = [];
  
  document.getElementById('home').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  showQuestion();
}

function startExamSimulation() {
  if (!QUESTIONS || QUESTIONS.length === 0) {
    alert('Questions are still loading...');
    return;
  }
  
  isExamMode = true;
  const examLength = 100;
  currentQuizLength = examLength;
  
  currentQuiz = selectExamQuestions(examLength);
  currentIndex = 0;
  score = 0;
  userAnswers = [];
  
  document.getElementById('home').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  showQuestion();
}

function selectExamQuestions(totalQuestions) {
  const domains = Object.keys(DOMAIN_WEIGHTS);
  let selectedQuestions = [];
  let remaining = totalQuestions;
  
  const questionsPerDomain = {};
  
  domains.forEach((domain, index) => {
    if (index === domains.length - 1) {
      questionsPerDomain[domain] = remaining;
    } else {
      const count = Math.round(totalQuestions * DOMAIN_WEIGHTS[domain]);
      questionsPerDomain[domain] = count;
      remaining -= count;
    }
  });
  
  domains.forEach(domain => {
    const needed = questionsPerDomain[domain];
    if (needed <= 0) return;
    
    const domainQuestions = QUESTIONS.filter(q => q.domain === domain);
    
    let missed = [], neverSeen = [], learning = [];
    
    domainQuestions.forEach(q => {
      const p = progress[q.id] || { seen:0, correct_streak:0, total_correct:0, ever_wrong:false, miss_count:0, mastered:false };
      
      if (p.mastered) return;
      
      if (p.seen > 0 && p.correct_streak < 2 && p.ever_wrong) {
        missed.push(q);
      } else if (p.seen === 0) {
        neverSeen.push(q);
      } else {
        learning.push(q);
      }
    });
    
    missed.sort((a, b) => {
      const pa = progress[a.id] || { miss_count: 0 };
      const pb = progress[b.id] || { miss_count: 0 };
      return (pb.miss_count || 0) - (pa.miss_count || 0);
    });
    
    let domainSelected = [];
    
    const missedToTake = Math.min(missed.length, Math.ceil(needed * 0.3));
    domainSelected = domainSelected.concat(missed.slice(0, missedToTake));
    
    if (domainSelected.length < needed) {
      neverSeen.sort(() => Math.random() - 0.5);
      const stillNeeded = needed - domainSelected.length;
      domainSelected = domainSelected.concat(neverSeen.slice(0, stillNeeded));
    }
    
    if (domainSelected.length < needed) {
      learning.sort(() => Math.random() - 0.5);
      const stillNeeded = needed - domainSelected.length;
      domainSelected = domainSelected.concat(learning.slice(0, stillNeeded));
    }
    
    selectedQuestions = selectedQuestions.concat(domainSelected.slice(0, needed));
  });
  
  return selectedQuestions.sort(() => Math.random() - 0.5);
}

function selectSmartQuestions(count) {
  let missed = [], neverSeen = [], learning = [];

  for (let q of QUESTIONS) {
    if (!SELECTED_DOMAINS.includes(q.domain)) continue;
    
    const p = progress[q.id] || { seen:0, correct_streak:0, total_correct:0, ever_wrong:false, miss_count:0, mastered:false };
    
    if (p.mastered) continue;
    
    if (p.seen > 0 && p.correct_streak < 2 && p.ever_wrong) {
      missed.push(q);
    } else if (p.seen === 0) {
      neverSeen.push(q);
    } else {
      learning.push(q);
    }
  }

  missed.sort((a, b) => {
    const pa = progress[a.id] || { miss_count: 0 };
    const pb = progress[b.id] || { miss_count: 0 };
    return (pb.miss_count || 0) - (pa.miss_count || 0);
  });

  let selected = [];
  
  const missedMin = Math.max(1, Math.floor(count * 0.15));
  const missedMax = Math.max(2, Math.floor(count * 0.2));
  
  const missedToTake = Math.min(missedMax, Math.max(missedMin, missed.length));
  selected = selected.concat(missed.slice(0, missedToTake));
  
  neverSeen.sort(() => Math.random() - 0.5);
  const remaining = count - selected.length;
  selected = selected.concat(neverSeen.slice(0, remaining));
  
  if (selected.length < count) {
    learning.sort(() => Math.random() - 0.5);
    selected = selected.concat(learning.slice(0, count - selected.length));
  }

  return selected.sort(() => Math.random() - 0.5).slice(0, count);
}

function showQuestion() {
  const q = currentQuiz[currentIndex];
  document.getElementById('progress').innerHTML = `Question <strong>${currentIndex + 1}</strong> of <strong>${currentQuiz.length}</strong>`;
  document.getElementById('question').innerHTML = q.question;
  
  const optDiv = document.getElementById('options');
  optDiv.innerHTML = '';
  
  q.options.forEach((text, i) => {
    const letter = String.fromCharCode(65 + i);
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<strong>${letter}.</strong> ${text}`;
    div.onclick = () => {
      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
      window.selectedLetter = letter;
    };
    optDiv.appendChild(div);
  });
  
  document.getElementById('explanation').style.display = 'none';
  document.getElementById('submitBtn').style.display = 'inline-block';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('masterBtn').style.display = 'none';
  window.selectedLetter = null;
}

function submitAnswer() {
  if (!window.selectedLetter) { alert('Please select an answer'); return; }
  
  const q = currentQuiz[currentIndex];
  const isCorrect = window.selectedLetter === q.correct;
  if (isCorrect) score++;
  
  if (!progress[q.id]) {
    progress[q.id] = { seen:0, correct_streak:0, total_correct:0, ever_wrong:false, miss_count:0, mastered:false, flagged:false, note:"" };
  }
  const p = progress[q.id];
  p.seen++;
  
  if (isCorrect) {
    p.total_correct++;
    p.correct_streak++;
  } else {
    p.correct_streak = 0;
    p.ever_wrong = true;
    p.miss_count = (p.miss_count || 0) + 1;
  }
  saveProgress();
  
  const selectedIndex = window.selectedLetter.charCodeAt(0) - 65;
  const selectedText = q.options[selectedIndex];
  const correctIndex = q.correct.charCodeAt(0) - 65;
  const correctText = q.options[correctIndex];
  
  userAnswers.push({
    selected: window.selectedLetter,
    selectedText: selectedText,
    correct: q.correct,
    correctText: correctText,
    isCorrect: isCorrect,
    domain: q.domain
  });
  
  document.querySelectorAll('.option').forEach(el => {
    const letter = el.innerText[0];
    if (letter === q.correct) el.classList.add('correct');
    else if (letter === window.selectedLetter && !isCorrect) el.classList.add('incorrect');
    el.onclick = null;
  });
  
  const exp = document.getElementById('explanation');
  exp.innerHTML = `<strong>Explanation</strong><br>${q.explanation || 'No explanation provided.'}`;
  exp.style.display = 'block';
  
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
  if (!progress[q.id].mastered) {
    document.getElementById('masterBtn').style.display = 'inline-block';
  }
}

function markAsMastered() {
  const q = currentQuiz[currentIndex];
  if (!progress[q.id]) progress[q.id] = {};
  progress[q.id].mastered = true;
  saveProgress();
  alert('Marked as Mastered permanently.');
  document.getElementById('masterBtn').style.display = 'none';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuiz.length) showQuestion();
  else showResults();
}

function showResults() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  
  const percent = Math.round((score / currentQuiz.length) * 100);
  let html = `<p style="font-size:1.3em; text-align:center;"><strong>${score} / ${currentQuiz.length}</strong> correct (${percent}%)</p>`;
  
  if (isExamMode) {
    html += `<p style="text-align:center; color:#64748b; margin-top:8px;"><em>Practice Exam Mode</em></p>`;
  }
  
  // Domain summary
  const domainSummary = {};
  userAnswers.forEach(ans => {
    if (!domainSummary[ans.domain]) {
      domainSummary[ans.domain] = { correct: 0, total: 0 };
    }
    domainSummary[ans.domain].total++;
    if (ans.isCorrect) domainSummary[ans.domain].correct++;
  });
  
  html += `<h3 style="margin-top:20px;">Performance by Domain</h3>`;
  Object.keys(domainSummary).forEach(domain => {
    const d = domainSummary[domain];
    const dPercent = Math.round((d.correct / d.total) * 100);
    html += `<div style="margin-bottom:6px; font-size:0.95em;">
      <strong>${domain}</strong>: ${d.correct}/${d.total} correct (${dPercent}%)
    </div>`;
  });
  
  html += `<h3 style="margin-top:24px;">Review</h3>`;
  
  userAnswers.forEach((ans, i) => {
    const q = currentQuiz[i];
    const p = progress[q.id] || { flagged: false, note: "" };
    
    html += `<div style="margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid #e2e8f0;">
      <strong>Q${i+1}.</strong> ${ans.isCorrect ? '✅' : '❌'} ${q.question}<br>
      <small style="color:#64748b; display:block; margin-top:4px;">${q.domain}</small><br>
      
      <small style="color:#64748b;">
        Your answer: <strong style="color:#1e293b;">${ans.selectedText}</strong> (${ans.selected})<br>
        Correct answer: <strong style="color:#16a34a;">${ans.correctText}</strong> (${ans.correct})
      </small>
      
      <div class="review-actions">
        <div class="review-header">Your Review</div>
        
        <label class="flag-checkbox">
          <input type="checkbox" ${p.flagged ? 'checked' : ''} onchange="toggleFlag('${q.id}', this.checked)">
          <span>Flag this question</span>
        </label>
        
        <textarea class="note-textarea" placeholder="Add your personal note or explanation here..." onchange="saveNote('${q.id}', this.value)">${p.note || ''}</textarea>
      </div>
    </div>`;
  });
  
  document.getElementById('stats').innerHTML = html;
}

// Toggle flag for a question
function toggleFlag(questionId, isFlagged) {
  if (!progress[questionId]) {
    progress[questionId] = { seen:0, correct_streak:0, total_correct:0, ever_wrong:false, miss_count:0, mastered:false, flagged:false, note:"" };
  }
  progress[questionId].flagged = isFlagged;
  saveProgress();
}

// Save note for a question
function saveNote(questionId, note) {
  if (!progress[questionId]) {
    progress[questionId] = { seen:0, correct_streak:0, total_correct:0, ever_wrong:false, miss_count:0, mastered:false, flagged:false, note:"" };
  }
  progress[questionId].note = note.trim();
  saveProgress();
}

function goHome() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('home').style.display = 'block';
  updateHomeStats();
}

function resetAllProgress() {
  if (confirm('Delete ALL progress?')) {
    localStorage.removeItem('acu_mastery_progress');
    progress = {};
    updateHomeStats();
    alert('Progress has been reset.');
  }
}

async function initApp() {
  await loadQuestions();
}

initApp();

// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(registration => {
        console.log('ServiceWorker registered successfully');
      })
      .catch(error => {
        console.log('ServiceWorker registration failed:', error);
      });
  });
}

// Helper functions for domain selection
function selectAllDomains() {
  const checkboxes = document.querySelectorAll('#domain-checkboxes input[type="checkbox"]');
  checkboxes.forEach(cb => cb.checked = true);
}

function selectWeakDomains() {
  if (!QUESTIONS || QUESTIONS.length === 0) return;
  
  const mastery = getDomainMastery();
  const sorted = Object.entries(mastery).sort((a, b) => a[1].percent - b[1].percent);
  const weakestCount = Math.max(2, Math.ceil(sorted.length / 2));
  const weakest = sorted.slice(0, weakestCount).map(d => d[0]);
  
  const checkboxes = document.querySelectorAll('#domain-checkboxes input[type="checkbox"]');
  checkboxes.forEach(cb => {
    cb.checked = weakest.includes(cb.dataset.domain);
  });
}
</script>
