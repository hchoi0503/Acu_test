<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acupuncture Quiz</title>
<style>
:root {
  --primary: #2563eb;
  --success: #16a34a;
  --danger: #dc2626;
  --bg: #f8fafc;
  --card: #ffffff;
}

* { box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: #1e293b;
  max-width: 860px;
  margin: 20px auto;
  padding: 16px;
  line-height: 1.6;
}

@media (max-width: 600px) {
  body { margin: 10px auto; padding: 12px; }
}

h1 {
  text-align: center;
  color: #0f172a;
  margin-bottom: 8px;
  font-size: 2rem;
}

@media (max-width: 600px) { h1 { font-size: 1.6rem; } }

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  margin-bottom: 20px;
}

@media (max-width: 600px) { .card { padding: 18px; border-radius: 12px; } }

button {
  background: var(--primary);
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  margin: 6px;
  min-height: 44px;
}

button:hover { background: #1d4ed8; }
button.secondary { background: #64748b; }
button.warning { background: #f59e0b; color: white; }

@media (max-width: 600px) {
  button { width: 100%; margin: 8px 0; font-size: 16px; }
}

.option {
  padding: 14px 18px;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  margin: 8px 0;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 15px;
  min-height: 52px;
  display: flex;
  align-items: center;
}

.option:hover { border-color: #94a3b8; background: #f8fafc; }
.option.selected { border-color: var(--primary); background: #eff6ff; }
.option.correct { border-color: var(--success); background: #dcfce7; }
.option.incorrect { border-color: var(--danger); background: #fee2e2; }

@media (max-width: 600px) { .option { font-size: 15px; padding: 16px 18px; } }

#question {
  font-size: 1.1em;
  font-weight: 600;
  margin-bottom: 20px;
  line-height: 1.5;
}

@media (max-width: 600px) { #question { font-size: 1.05em; } }

#explanation {
  background: #fefce8;
  border-left: 5px solid #eab308;
  padding: 16px 20px;
  border-radius: 12px;
  margin-top: 20px;
  display: none;
}

@media (max-width: 600px) { #explanation { padding: 14px 16px; } }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin: 20px 0;
}

@media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr 1fr; } }

.stat-card {
  background: #f1f5f9;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
}

.stat-number {
  font-size: 1.8em;
  font-weight: 700;
  color: var(--primary);
}

#progress {
  font-weight: 600;
  color: #475569;
  margin-bottom: 12px;
}

.quiz-length-buttons {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

@media (max-width: 600px) {
  .quiz-length-buttons {
    flex-direction: column;
    gap: 10px;
  }
}
</style>
</head>
<body>

<div id="home">
  <h1>Acupuncture Quiz</h1>
  <p style="text-align:center; color:#64748b; margin-bottom:24px;">1210 questions • Smart Mastery System</p>
  
  <div class="card">
    <div class="stats-grid" id="home-stats"></div>
    
    <div style="text-align:center; margin-top:24px;">
      <p style="margin-bottom:12px; font-weight:600; color:#475569;">Choose quiz length:</p>
      
      <div class="quiz-length-buttons">
        <button onclick="startQuiz(10)" id="btn10" disabled style="font-size:17px; padding:14px 36px; background:#16a34a;">
          Start 10 Questions
        </button>
        <button onclick="startQuiz(20)" id="btn20" disabled style="font-size:17px; padding:14px 36px;">
          Start 20 Questions
        </button>
      </div>
      
      <div style="margin-top:20px;">
        <button onclick="resetAllProgress()" class="secondary">Reset All Progress</button>
      </div>
    </div>
  </div>
</div>

<div id="quiz" style="display:none;">
  <div class="card">
    <div id="progress"></div>
    <div id="question"></div>
    <div id="options"></div>
    <div id="explanation"></div>
    
    <div style="margin-top:24px; display:flex; gap:12px; flex-wrap:wrap;" id="action-buttons">
      <button onclick="submitAnswer()" id="submitBtn">Submit Answer</button>
      <button onclick="nextQuestion()" id="nextBtn" style="display:none;">Next Question</button>
      <button onclick="markAsMastered()" id="masterBtn" class="warning" style="display:none;">Mark as Mastered</button>
    </div>
  </div>
</div>

<div id="results" style="display:none;">
  <div class="card">
    <h2 style="margin-top:0;">Quiz Complete</h2>
    <div id="stats"></div>
    <div style="margin-top:24px;">
      <button onclick="startQuiz(currentQuizLength)">Take Another Quiz</button>
      <button onclick="goHome()" class="secondary">Back to Home</button>
    </div>
  </div>
</div>

<script>
// QUESTIONS will be loaded from questions.json
let QUESTIONS = [];

let progress = JSON.parse(localStorage.getItem('acu_mastery_progress') || '{}');

function saveProgress() {
  localStorage.setItem('acu_mastery_progress', JSON.stringify(progress));
}

let currentQuiz = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];
let currentQuizLength = 20;

// Load questions from external JSON file
async function loadQuestions() {
  try {
    const response = await fetch('questions.json');
    
    if (!response.ok) {
      throw new Error('Failed to load questions.json');
    }
    
    QUESTIONS = await response.json();
    
    // Enable buttons only after successful load
    document.getElementById('btn10').disabled = false;
    document.getElementById('btn20').disabled = false;
    
    // Now it's safe to update stats
    updateHomeStats();
    
  } catch (error) {
    console.error('Error loading questions:', error);
    
    const homeContainer = document.getElementById('home');
    homeContainer.innerHTML = `
      <div class="card">
        <h2 style="color:#dc2626;">Failed to Load Questions</h2>
        <p>Could not load <strong>questions.json</strong>.</p>
        <p style="color:#64748b; font-size:0.9em;">
          Please make sure <code>questions.json</code> exists in the same folder.<br>
          If running locally, use VS Code Live Server or run <code>python -m http.server</code>.
        </p>
      </div>
    `;
  }
}

// Safe version of updateHomeStats with guard
function updateHomeStats() {
  // Safety check: Don't run if QUESTIONS is not loaded yet
  if (!QUESTIONS || QUESTIONS.length === 0) {
    return;
  }
  
  let mastered = 0, missed = 0, neverSeen = 0;
  
  for (let q of QUESTIONS) {
    const p = progress[q.id];
    if (!p) { neverSeen++; continue; }
    if (p.mastered) mastered++;
    else if (p.seen > 0 && p.correct_streak < 2 && p.ever_wrong) missed++;
    else if (p.seen === 0) neverSeen++;
  }
  
  document.getElementById('home-stats').innerHTML = `
    <div class="stat-card">
      <div class="stat-number">${QUESTIONS.length}</div>
      <div style="color:#64748b; font-size:0.9em;">Total Questions</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" style="color:#16a34a;">${mastered}</div>
      <div style="color:#64748b; font-size:0.9em;">Mastered</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" style="color:#dc2626;">${missed}</div>
      <div style="color:#64748b; font-size:0.9em;">Missed (Active)</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" style="color:#2563eb;">${neverSeen}</div>
      <div style="color:#64748b; font-size:0.9em;">Never Seen</div>
    </div>
  `;
}

function startQuiz(length) {
  // Safety check
  if (!QUESTIONS || QUESTIONS.length === 0) {
    alert('Questions are still loading. Please wait a moment and try again.');
    return;
  }
  
  currentQuizLength = length;
  currentQuiz = selectSmartQuestions(length);
  currentIndex = 0;
  score = 0;
  userAnswers = [];
  
  document.getElementById('home').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  showQuestion();
}

function selectSmartQuestions(count) {
  let missed = [], neverSeen = [], learning = [];

  for (let q of QUESTIONS) {
    const p = progress[q.id] || { seen:0, correct_streak:0, total_correct:0, ever_wrong:false, mastered:false };
    
    if (p.mastered) continue;
    
    if (p.seen > 0 && p.correct_streak < 2 && p.ever_wrong) {
      missed.push(q);
    } else if (p.seen === 0) {
      neverSeen.push(q);
    } else {
      learning.push(q);
    }
  }

  let selected = [];
  
  const missedMin = Math.max(1, Math.floor(count * 0.15));
  const missedMax = Math.max(2, Math.floor(count * 0.2));
  
  missed.sort(() => Math.random() - 0.5);
  const missedToTake = Math.min(missedMax, Math.max(missedMin, missed.length));
  selected = selected.concat(missed.slice(0, missedToTake));
  
  neverSeen.sort(() => Math.random() - 0.5);
  const remaining = count - selected.length;
  selected = selected.concat(neverSeen.slice(0, remaining));
  
  if (selected.length < count) {
    learning.sort(() => Math.random() - 0.5);
    selected = selected.concat(learning.slice(0, count - selected.length));
  }

  return selected.sort(() => Math.random() - 0.5).slice(0, count);
}

function showQuestion() {
  const q = currentQuiz[currentIndex];
  document.getElementById('progress').innerHTML = `Question <strong>${currentIndex + 1}</strong> of <strong>${currentQuiz.length}</strong>`;
  document.getElementById('question').innerHTML = q.question;
  
  const optDiv = document.getElementById('options');
  optDiv.innerHTML = '';
  
  q.options.forEach((text, i) => {
    const letter = String.fromCharCode(65 + i);
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<strong>${letter}.</strong> ${text}`;
    div.onclick = () => {
      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
      window.selectedLetter = letter;
    };
    optDiv.appendChild(div);
  });
  
  document.getElementById('explanation').style.display = 'none';
  document.getElementById('submitBtn').style.display = 'inline-block';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('masterBtn').style.display = 'none';
  window.selectedLetter = null;
}

function submitAnswer() {
  if (!window.selectedLetter) { alert('Please select an answer'); return; }
  
  const q = currentQuiz[currentIndex];
  const isCorrect = window.selectedLetter === q.correct;
  if (isCorrect) score++;
  
  if (!progress[q.id]) {
    progress[q.id] = { seen:0, correct_streak:0, total_correct:0, ever_wrong:false, mastered:false };
  }
  const p = progress[q.id];
  p.seen++;
  
  if (isCorrect) {
    p.total_correct++;
    p.correct_streak++;
  } else {
    p.correct_streak = 0;
    p.ever_wrong = true;
  }
  saveProgress();
  
  // Save answer for review
  const selectedIndex = window.selectedLetter.charCodeAt(0) - 65;
  const selectedText = q.options[selectedIndex];
  
  const correctIndex = q.correct.charCodeAt(0) - 65;
  const correctText = q.options[correctIndex];
  
  userAnswers.push({
    selected: window.selectedLetter,
    selectedText: selectedText,
    correct: q.correct,
    correctText: correctText,
    isCorrect: isCorrect
  });
  
  document.querySelectorAll('.option').forEach(el => {
    const letter = el.innerText[0];
    if (letter === q.correct) el.classList.add('correct');
    else if (letter === window.selectedLetter && !isCorrect) el.classList.add('incorrect');
    el.onclick = null;
  });
  
  const exp = document.getElementById('explanation');
  exp.innerHTML = `<strong>Explanation</strong><br>${q.explanation || 'No explanation provided.'}`;
  exp.style.display = 'block';
  
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
  if (!progress[q.id].mastered) {
    document.getElementById('masterBtn').style.display = 'inline-block';
  }
}

function markAsMastered() {
  const q = currentQuiz[currentIndex];
  if (!progress[q.id]) progress[q.id] = {};
  progress[q.id].mastered = true;
  saveProgress();
  alert('Marked as Mastered permanently.');
  document.getElementById('masterBtn').style.display = 'none';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuiz.length) showQuestion();
  else showResults();
}

function showResults() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  
  const percent = Math.round((score / currentQuiz.length) * 100);
  let html = `<p style="font-size:1.3em; text-align:center;"><strong>${score} / ${currentQuiz.length}</strong> correct (${percent}%)</p>`;
  
  html += `<h3 style="margin-top:24px;">Review</h3>`;
  
  userAnswers.forEach((ans, i) => {
    const q = currentQuiz[i];
    html += `<div style="margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #e2e8f0;">
      <strong>Q${i+1}.</strong> ${ans.isCorrect ? '✅' : '❌'} ${q.question}<br><br>
      <small style="color:#64748b;">
        Your answer: <strong style="color:#1e293b;">${ans.selectedText}</strong> (${ans.selected})<br>
        Correct answer: <strong style="color:#16a34a;">${ans.correctText}</strong> (${ans.correct})
      </small>
    </div>`;
  });
  
  document.getElementById('stats').innerHTML = html;
}

function goHome() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('home').style.display = 'block';
  updateHomeStats();
}

function resetAllProgress() {
  if (confirm('Delete ALL progress?')) {
    localStorage.removeItem('acu_mastery_progress');
    progress = {};
    updateHomeStats();
    alert('Progress has been reset.');
  }
}

// Initialize app
async function initApp() {
  await loadQuestions();
}

initApp();
</script>
</body>
</html>
